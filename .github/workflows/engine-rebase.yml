name: engine rebase

# M6 vendors quickjs-ng and patches it (vendor/job-queue-hook.patch). The patch is the project's
# only long-lived fork, so its health is checked weekly: the pinned tree must still reverse-apply
# (i.e. the vendor copy is exactly upstream + patch), and the patch is attempted against the
# newest upstream tag. A failed latest-tag attempt is reported, not fatal: upgrading also needs an
# rquickjs that binds the newer C API (docs/m6-plan.md §10.1), which is an M7 task.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

jobs:
  pinned:
    name: pinned tree is upstream + patch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: reverse-apply the patch against the vendored tree
        run: cd vendor/rquickjs-sys && patch -p1 -R --dry-run < ../job-queue-hook.patch
      - uses: dtolnay/rust-toolchain@stable
      - name: build and run the corpus on the vendored engine
        run: |
          cargo build
          ./test/conformance/run.sh
          ./test/async/run.sh

  latest:
    name: patch applies to the newest upstream tag
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: newest quickjs-ng tag
        id: tag
        run: |
          tag="$(curl -fsSL 'https://api.github.com/repos/quickjs-ng/quickjs/releases/latest' | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "newest upstream tag: $tag"
      - name: apply the patch to it
        run: |
          curl -fsSL "https://github.com/quickjs-ng/quickjs/archive/refs/tags/${{ steps.tag.outputs.tag }}.tar.gz" -o /tmp/qjs.tgz
          rm -rf /tmp/qjs && mkdir -p /tmp/qjs/quickjs
          tar -xzf /tmp/qjs.tgz -C /tmp/qjs/quickjs --strip-components=1
          cd /tmp/qjs && patch -p1 < "$GITHUB_WORKSPACE/vendor/job-queue-hook.patch"
      - name: build the workspace against it
        run: |
          rm -rf vendor/rquickjs-sys/quickjs
          cp -a /tmp/qjs/quickjs vendor/rquickjs-sys/quickjs
          cargo build
          ./test/conformance/run.sh
          ./test/async/run.sh
      - name: note the rebase result
        run: |
          echo "Patched ${{ steps.tag.outputs.tag }} successfully. If this is newer than the pin in" \
               "vendor/README.md, open an M7 task: the upgrade also needs an rquickjs that binds the" \
               "newer dynamic-import API." >> "$GITHUB_STEP_SUMMARY"
