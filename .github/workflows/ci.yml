name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all
      - name: build
        run: cargo build
      - name: conformance corpus
        run: ./test/conformance/run.sh
      - name: node for the stdlib oracle
        uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: stdlib tests (node + lite) and Node oracles
        run: ./test/js/run.sh
      - name: M3 acceptance programs (cat, wc -l, cp -r)
        run: ./test/programs/run.sh
      - name: module smoke set (30 CJS + 10 ESM packages)
        run: ./test/smoke/run.sh
      - name: smoke
        run: |
          test "$(cargo run -q -p ln-cli -- -e '1+1')" = "2"
          cargo run -q -p ln-cli -- --version
          printf 'const x = 1;\n' > /tmp/lite-check.js
          cargo run -q -p ln-cli -- --check /tmp/lite-check.js

  # tuckbox is the demo that keeps the runtime honest: a real tool, in TypeScript, resolving and
  # installing real npm packages with nothing but the modules onde implements. Each suite runs
  # under node AND onde and the outputs are compared, so a module cannot quietly lean on either.
  tuckbox:
    name: tuckbox (a package installer on onde)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: build onde
        run: cargo build
      - name: install and build tuckbox
        working-directory: tuckbox
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: tests under node and onde
        working-directory: tuckbox
        run: node test/run.js
        env:
          TUCKBOX_LITE: ${{ github.workspace }}/target/debug/lite

  # The corpus is the contract. This job proves the .expected files still describe real Node
  # behaviour, so they cannot silently rot into "whatever onde does". It also runs the
  # differential harness (node vs lite, same stdout + exit code) from scratch.
  corpus-selftest:
    name: corpus is still Node-valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: node self-test
        run: RUN=node ./test/conformance/run.sh
      - name: build lite
        run: cargo build
      - name: differential (node vs lite)
        run: ./test/differential.sh
      - name: module smoke set against Node
        run: ./test/smoke/run.sh
      - name: stdlib oracles against Node
        run: ./test/js/run.sh

  # License policy: deny.toml. A separate job because it does not depend on the OS matrix.
  # M4 adds `webpki-roots` (MPL-2.0), which the allowlist covers.
  licenses:
    name: licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: licenses bans sources

  # WP7 network acceptance harness. Performance thresholds are soft in CI (a shared runner is not
  # the reference machine): req/s, latency and cold-start misses are informational. Interop, the
  # fd/RSS leak check and the slow-loris memory bound are functional and block the job. The corpus
  # itself is graded by the `test` and `corpus-selftest` jobs.
  acceptance:
    name: M4 network acceptance (soft perf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: build debug and release
        run: |
          cargo build
          cargo build --release -p ln-cli
      - name: network acceptance (soft performance thresholds)
        run: NET_BENCH_SOFT=1 ./test/net/run.sh
