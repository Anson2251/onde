[package]
name = "ln-payload"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The onde payload: a flat key/value map of ES modules linked into a standalone executable"
publish = false

[dependencies]
# The header repeats the engine identity, so the encoder cannot disagree with the archive it
# will be linked against. `ln-abi` has no dependencies and no I/O beyond reading the stamp.
ln-abi = { path = "../ln-abi" }
