[package]
name = "ln-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sans-io HTTP/1.1 codec for onde: bytes in, events out"
publish = false

[dependencies]
ln-error = { path = "../ln-error" }
# Head parsing only. Framing (chunked, lengths, trailers) is ours: see ADR-0007 §2.4.
httparse = "1"
