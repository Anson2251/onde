[package]
name = "ln-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolate bootstrap, host globals and the microtask checkpoint driver for onde"
publish = false

[dependencies]
ln-crypto = { path = "../ln-crypto" }
ln-engine = { path = "../ln-engine" }
ln-error = { path = "../ln-error" }
# The locked codec types (Event, BodyMode, Role, Limits) appear inside `ln_io::net::Event::Http`
# and in the `httpAttach` command, so the bridge names them directly instead of re-declaring a
# mirror enum. This is the same crate `ln-io` already depends on; no new external dependency.
ln-http = { path = "../ln-http" }
ln-io = { path = "../ln-io" }
ln-sched = { path = "../ln-sched" }
ln-modules = { path = "../ln-modules" }
# `node:zlib`'s whole-buffer gzip/deflate/crc32 implementation (host/zlib.rs), and the inflater
# for a `--compress`ed compiled-app payload at startup.
ln-zlib = { path = "../ln-zlib" }
# The payload format a compiled app carries: parsed here, encoded by `ondec`.
ln-payload = { path = "../ln-payload" }
# A compiled app's `--compress zstd` payload. Optional because it is the only decoder here that
# costs binary size (zlib is already linked for `node:zlib`): a build without this feature refuses
# a zstd payload with a message instead of misreading it.
zstd = { version = "0.13", optional = true }
# `memchr`-class byte search for Buffer.indexOf/lastIndexOf (already in the graph).
memchr = "2"
# The standard base64 encoder/decoder; already in the graph through the TLS/payload stack. The
# Node-lenient sanitizer in front of the decoder stays local (see host/codec.rs), because Node's
# decode is not RFC 4648.
base64 = "0.23"
serde_json = "1"

[features]
# Empty by default: `lite` needs no payload decoder, and the SDK's archive enables what it ships
# (see `ln-embed`'s `zstd-payload`).
default = []
zstd = ["dep:zstd"]

[target.'cfg(unix)'.dependencies]
# Host identity (ppid, uid/gid, hostname, uname, memory totals) has no `std` equivalent.
libc = "0.2"

[build-dependencies]
# Build-time only: the JS stdlib is minified into `OUT_DIR/js` (see build.rs). Pinned to the
# series whose MSRV matches the workspace (1.80); newer oxc releases need a newer toolchain.
oxc_allocator = "0.48.2"
oxc_codegen = "0.48.2"
oxc_minifier = "0.48.2"
oxc_parser = "0.48.2"
oxc_span = "0.48.2"
