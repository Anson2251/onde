[package]
name = "ln-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolate bootstrap, host globals and the microtask checkpoint driver for onde"
publish = false

[dependencies]
ln-crypto = { path = "../ln-crypto" }
ln-engine = { path = "../ln-engine" }
ln-error = { path = "../ln-error" }
# The locked codec types (Event, BodyMode, Role, Limits) appear inside `ln_io::net::Event::Http`
# and in the `httpAttach` command, so the bridge names them directly instead of re-declaring a
# mirror enum. This is the same crate `ln-io` already depends on; no new external dependency.
ln-http = { path = "../ln-http" }
ln-io = { path = "../ln-io" }
ln-sched = { path = "../ln-sched" }
ln-modules = { path = "../ln-modules" }
# `node:zlib`'s whole-buffer gzip/deflate/crc32 implementation (host/zlib.rs), and the inflater
# for a `--compress zlib` compiled-app payload at startup. Always linked: the `node-zlib` feature only
# removes the module surface, not the payload decoder.
ln-zlib = { path = "../ln-zlib" }
# `node:sqlite` (host/sqlite.rs). Optional so a size-sensitive build can drop the bundled SQLite
# with the `node-sqlite` feature; it is in `default` so the normal binary is complete.
ln-sqlite = { path = "../ln-sqlite", optional = true }
# The payload format a compiled app carries: parsed here, encoded by `ondec`.
ln-payload = { path = "../ln-payload" }
# A compiled app's `--compress zstd` payload. Optional because it is the only payload decoder
# that costs binary size (the zlib inflater stays linked for `--compress zlib` even when the
# `node:zlib` module is turned off): a build without this feature refuses a zstd payload with a
# message instead of misreading it.
zstd = { version = "0.13", optional = true }
# `memchr`-class byte search for Buffer.indexOf/lastIndexOf (already in the graph).
memchr = "2"
# The standard base64 encoder/decoder; already in the graph through the TLS/payload stack. The
# Node-lenient sanitizer in front of the decoder stays local (see host/codec.rs), because Node's
# decode is not RFC 4648.
base64 = "0.23"
serde_json = "1"

[features]
# Both modules are on by default because they are Node core modules; each feature only gates the
# `node:` surface (the host module, the embedded JS and the builtin table entry). Turning `sqlite`
# off also drops the bundled SQLite; `zlib` leaves `ln-zlib` linked because the payload decoder
# needs it for `--compress zlib` compiled apps.
default = ["node-sqlite", "node-zlib"]
node-sqlite = ["dep:ln-sqlite"]
node-zlib = []
# Embeds the bootstrap source in a release build as well as the snapshot, so the two boot paths can
# be A/B measured in one optimized binary (m7-plan §4.3). Never on in a shipped build: it is ~55 KiB
# of source that only exists to be compared against (D72).
bootstrap-source = []
zstd = ["dep:zstd"]

[target.'cfg(unix)'.dependencies]
# Host identity (ppid, uid/gid, hostname, uname, memory totals) has no `std` equivalent.
libc = "0.2"

[build-dependencies]
# WP2: the bootstrap is compiled to bytecode at build time by the same engine the runtime links
# (see build.rs `write_bootstrap_snapshot`), and the envelope it is wrapped in is the payload
# crate's snapshot format. Both are host-side only: neither is linked into a build without them.
ln-engine = { path = "../ln-engine" }
ln-payload = { path = "../ln-payload" }
# Build-time only: the JS stdlib is minified into `OUT_DIR/js` (see build.rs). Pinned to the
# series whose MSRV matches the workspace floor (1.89); newer oxc releases need a newer toolchain.
oxc_allocator = "0.48.2"
oxc_codegen = "0.48.2"
oxc_minifier = "0.48.2"
oxc_parser = "0.48.2"
oxc_span = "0.48.2"
