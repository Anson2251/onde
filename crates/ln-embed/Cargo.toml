[package]
name = "ln-embed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The C ABI of a compiled onde app: onde.h and libonde-<tuple>.a"
publish = false

[lib]
# The archive a compiled app links against. `libonde.a`: the crate name is not what users see,
# the C symbol names are.
name = "onde"
crate-type = ["staticlib"]

[features]
# A linked app carries the zstd payload decoder unless the archive is built without it. Off by
# default would be silent breakage for anyone who uses `--compress zstd`; on by default costs
# ~250 KB of decoder in every app, which is the trade the release decides (see the docs).
default = ["zstd-payload", "zlib-payload", "node-sqlite", "node-zlib"]
zstd-payload = ["ln-runtime/zstd"]
# A compiled app may be built with `--compress zlib`, so the SDK keeps the inflater even when the
# `node:zlib` module is not wanted in the image.
zlib-payload = ["ln-runtime/zlib-payload"]
# A slim archive can be built with `--no-default-features`; a compiled app that imports
# `node:sqlite`/`node:zlib` then fails at build time rather than at run time, which is the honest
# failure. The features mirror `ln-runtime`'s.
node-sqlite = ["ln-runtime/node-sqlite"]
node-zlib = ["ln-runtime/node-zlib"]

[dependencies]
ln-runtime = { path = "../ln-runtime", default-features = false }
# `engine_stamp()` for `onde_engine_stamp()`, and the payload reader through `ln-runtime`.
ln-engine = { path = "../ln-engine" }
ln-payload = { path = "../ln-payload" }

[build-dependencies]
# The marker baked into the archive must be the same string the runtime compares against.
ln-abi = { path = "../ln-abi" }
