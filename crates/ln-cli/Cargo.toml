[package]
name = "ln-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `lite` CLI for onde"
publish = false

[[bin]]
name = "lite"
path = "src/main.rs"

[features]
# `node:sqlite` and `node:zlib` are on by default; `--no-default-features` builds a slim `lite`
# where requiring either gives a message naming the missing feature.
default = ["node-sqlite", "node-zlib"]
node-sqlite = ["ln-runtime/node-sqlite"]
node-zlib = ["ln-runtime/node-zlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ln-runtime = { path = "../ln-runtime", default-features = false }
