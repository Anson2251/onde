[package]
name = "ln-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The `onde` CLI for onde"
publish = false
default-run = "onde"

[[bin]]
name = "onde"
path = "src/main.rs"

[features]
# Every optional module is on by default; `--no-default-features` builds a slim `onde` where
# requiring one gives a message naming the missing feature. `node-tls` implies `node-net`.
default = ["node-net", "node-tls", "node-crypto", "node-sqlite", "node-zlib"]
node-net = ["ln-runtime/node-net"]
node-tls = ["ln-runtime/node-tls"]
node-crypto = ["ln-runtime/node-crypto"]
node-sqlite = ["ln-runtime/node-sqlite"]
node-zlib = ["ln-runtime/node-zlib"]
# `onde` never executes a compiled payload, so this is not in `default`; the mapping exists so the
# feature set is complete for a caller that wants it.
zlib-payload = ["ln-runtime/zlib-payload"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ln-runtime = { path = "../ln-runtime", default-features = false }
