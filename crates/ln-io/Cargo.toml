[package]
name = "ln-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blocking fs ops, the tokio offload pool and the M4 network transports for onde"
publish = false

[dependencies]
ln-error = { path = "../ln-error" }
ln-http = { path = "../ln-http" }
getrandom = "0.2"
# `net`/`io-util` are M4: sockets, DNS and the connection tasks that drive `ln-http`.
# `macros` is `tokio::select!`, the one `await` point that waits on commands, reads and writes
# at once. `process` is M5 WP3: child processes with pipes (`tokio::process`). It is a tokio
# feature, not an extra dependency.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "io-util",
    "macros",
    "process",
    "signal",
] }

# M4 TLS (WP6). The provider is pinned to `ring`: rustls' default `aws-lc-rs` needs cmake/nasm,
# while `ring` needs only the C compiler the engine already requires (m4-plan §1).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Node's bundled Mozilla root store (`tls.rootCertificates` / the default client trust anchors).
webpki-roots = "1"
# PEM parsing for `ca`/`cert`/`key`.
rustls-pemfile = "2"
# Optional OS trust store (`ONDE_USE_SYSTEM_CA=1`), Node's `--use-system-ca` equivalent.

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# SO_KEEPALIVE timings (TCP_KEEPIDLE/TCP_KEEPINTVL) and the listener options tokio does not expose.
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"
