[package]
name = "ln-io"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Blocking fs ops and the tokio offload pool for lite-node"
publish = false

[dependencies]
ln-error = { path = "../ln-error" }
getrandom = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
