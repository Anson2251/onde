# cargo-deny policy for onde.
#
# The project ships binaries, so every dependency must be redistributable under a permissive or
# weak-copyleft license. CDLA-Permissive-2.0 is allowed because `webpki-roots` ships M4's bundled CA
# store under it. It is a permissive data license (Apache-2.0-like, no copyleft) covering the
# certificate bundle rather than code, which is why it is listed explicitly instead of being folded
# into the code licenses.
#
# Run: cargo deny check

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-apple-darwin" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
# Most crates state their license in SPDX terms; a lower threshold would let a fuzzy match through.
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "CDLA-Permissive-2.0",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  # `xxhash-rust` (rolldown's hasher) is BSL-1.0: permissive, OSI-approved, no copyleft. It is the
  # only dependency that offers no other choice; the dual-licensed crates (0BSD/MIT/Apache-2.0,
  # Apache-2.0/BSL-1.0, Unlicense/MIT, Apache-2.0/GPL-2.0-only) already pass on their permissive
  # arm, so they are not listed separately.
  "BSL-1.0",
  # The workspace's own runtime crates are MPL-2.0 (see README § Licensing). MPL-2.0 is weak,
  # file-scoped copyleft, so it also stays acceptable for a third-party dependency: the obligation
  # is publishing modifications to that dependency's files, and this tree modifies none of them.
  # Anything stronger (LGPL, GPL, AGPL) stays out, which is what keeps the shipped binaries
  # redistributable under the terms the README promises.
  "MPL-2.0",
]

[bans]
# Duplicate versions are reported for review, not blocked: `getrandom` and the `windows-*` family
# legitimately appear more than once in the graph.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
